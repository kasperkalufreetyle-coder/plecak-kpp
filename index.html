:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;--bg:#0c141d;--panel:#182430;--panel2:#202f3c;--line:#314251;--text:#f1f5f9;--muted:#a7b5c4;--red:#f04d54;--green:#52d6a1;--amber:#ffbe55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);padding-bottom:100px}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:5;background:#101b26ed;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 12px) 17px 14px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:20px;font-weight:850;letter-spacing:-.6px}.logo em{font-style:normal;color:var(--red)}.tiny{font-size:12px;color:var(--muted)}main{max-width:740px;margin:auto;padding:18px 15px}.intro h1{font-size:25px;margin:3px 0 6px;letter-spacing:-.6px}.intro p{color:var(--muted);margin:0 0 19px;line-height:1.5}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px}.card strong{display:block;font-size:26px;margin:7px 0 3px}.card span{color:var(--muted);font-size:12px}.panel{margin-bottom:13px}.panel h2{font-size:17px;margin:0 0 12px}.panel p{color:var(--muted);line-height:1.55}.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0 11px}.section-title h2{margin:0;font-size:18px}.btn{background:var(--red);border:0;border-radius:11px;color:white;font-weight:750;padding:11px 14px;min-height:42px}.btn.secondary{background:#2a3b49}.btn.ghost{background:transparent;border:1px solid var(--line)}.btn.small{padding:8px 10px;min-height:34px;font-size:13px}.btn.danger{background:#652b33}.btnrow{display:flex;gap:8px;flex-wrap:wrap}.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item small{display:block;margin-top:5px;color:var(--muted);line-height:1.4}.item-main{min-width:0;flex:1}.item-main b{overflow-wrap:anywhere}.tag{display:inline-block;border-radius:8px;background:#324452;padding:3px 7px;font-size:11px;margin:3px 4px 0 0}.tag.bad{background:#66323c;color:#ffd1d5}.tag.warn{background:#54432a;color:#ffcf75}.tag.ok{background:#23483e;color:#86efd1}.form{display:grid;gap:10px}.form label{font-size:12px;color:var(--muted);display:grid;gap:5px}.form input,.form select,.form textarea,.search{width:100%;border:1px solid var(--line);border-radius:10px;background:#0e1822;color:var(--text);padding:12px;outline:none}.form input:focus,.form select:focus,.form textarea:focus,.search:focus{border-color:var(--red)}.form textarea{min-height:80px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none!important}.nav{position:fixed;z-index:7;bottom:0;left:0;right:0;padding:8px 5px calc(7px + env(safe-area-inset-bottom));background:#13202b;border-top:1px solid var(--line);display:flex;justify-content:space-around;gap:3px}.nav button{border:0;background:none;color:var(--muted);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 2px;min-width:49px}.nav button.active{color:white}.nav button span{font-size:21px}.notice{padding:12px 14px;background:#352c22;border:1px solid #665038;border-radius:12px;color:#f9d39c;font-size:13px;line-height:1.5;margin-bottom:16px}.okay{color:var(--green)}.warn{color:var(--amber)}.bad{color:#ff777e}.progress{height:8px;border-radius:12px;background:#334351;overflow:hidden}.progress>div{height:100%;background:var(--green);transition:width .2s}.muted{color:var(--muted)}.tabgroup{display:flex;gap:8px;overflow-x:auto;margin:0 0 15px}.tabgroup button{white-space:nowrap}.tabgroup .selected{background:var(--red)}details{border-bottom:1px solid var(--line);padding:10px 0}summary{cursor:pointer;font-weight:650}details p,details li{line-height:1.6;color:#cad5df;font-size:14px}.question{font-weight:650;font-size:15px}.answer{margin-top:8px;font-size:14px}.modal{position:fixed;z-index:20;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-width:640px;max-height:90dvh;overflow:auto;background:#182632;border:1px solid var(--line);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 17px}a{color:#89c5ff}.empty{color:var(--muted);font-size:14px;padding:15px 0}.check{width:22px;height:22px;accent-color:var(--green)}.foot{margin-top:23px;color:var(--muted);font-size:12px;line-height:1.6}@media(min-width:700px){.nav{left:calc(50% - 355px);right:calc(50% - 355px);border-radius:18px 18px 0 0}.sheet{border-radius:20px;margin-bottom:20px}.modal{align-items:center}}@media(max-width:355px){.nav button{font-size:9px;min-width:43px}}
</style></head><body><header class="top"><div><div class="logo">⛑ Rescue<em>OS</em></div><div class="tiny" id="unit-label">Osobiste centrum ratownika</div></div><button class="btn secondary small" onclick="go('settings')">⚙ Ustawienia</button></header><main id="app"></main><nav class="nav" id="nav"></nav><div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div><input type="file" id="importfile" accept="application/json,.json" class="hidden"><script>
'use strict';const KEY='rescueos-v1';const defaultState=()=>({unit:'',name:'',equipment:[],vehicles:[],tasks:[],checks:[],training:[],notes:[],audit:[],quizStats:{correct:0,total:0}});let state;try{state={...defaultState(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){state=defaultState()}let page='home',equipmentSearch='',filterVehicle='',quizIndex=0,quizAnswered=false;const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('sv-SE');const dateDiff=d=>d?Math.ceil((new Date(d+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000):Infinity;const statusDate=d=>!d?'bez terminu':dateDiff(d)<0?'PO TERMINIE':dateDiff(d)<=30?'≤ 30 dni':'aktualny';const labelStatus=d=>!d?'':`<span class="tag ${dateDiff(d)<0?'bad':dateDiff(d)<=30?'warn':'ok'}">${esc(statusDate(d))}: ${esc(d)}</span>`;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Nie można zapisać danych. Zwolnij miejsce w pamięci urządzenia.')}};const update=(key,obj)=>{if(!Array.isArray(state[key]))state[key]=[];const i=state[key].findIndex(x=>x.id===obj.id);if(i<0)state[key].push(obj);else state[key][i]=obj;save();render()};const remove=(key,id)=>{if(!confirm('Usunąć ten wpis?'))return;state[key]=state[key].filter(x=>x.id!==id);save();render()};const btn=(t,fn,cls='secondary small')=>`<button class="btn ${cls}" onclick="${fn}">${t}</button>`;function go(p){page=p;render();window.scrollTo(0,0)}function openModal(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}function fields(form){return Object.fromEntries(new FormData(form).entries())}const opts=(arr,chosen)=>arr.map(x=>`<option value="${esc(x)}" ${x===chosen?'selected':''}>${esc(x)}</option>`).join('');const categories=['KPP','Armatura','OSP / pojazd','ODO','Ratownictwo techniczne','Łączność','Oświetlenie','Inne'];function modalForm(type,id){const old=(state[type]||[]).find(x=>x.id===id)||{};let title='',body='';if(type==='equipment'){title='Sprzęt / wyposażenie';body=`<label>Nazwa<input name="name" required value="${esc(old.name)}"></label><div class="form-grid"><label>Kategoria<select name="category">${opts(categories,old.category||'KPP')}</select></label><label>Przypisanie<select name="vehicle">${opts(['Osobisty / plecak',...state.vehicles.map(x=>x.name)],old.vehicle||'Osobisty / plecak')}</select></label></div><div class="form-grid"><label>Wymagana ilość<input type="number" name="required" min="0" step="1" value="${old.required??1}" required></label><label>Faktyczna ilość<input type="number" name="qty" min="0" step="1" value="${old.qty??0}" required></label></div><label>Data ważności / przeglądu<input name="expires" type="date" value="${esc(old.expires)}"></label><label>Lokalizacja / skrytka<input name="location" value="${esc(old.location)}"></label><label>Uwagi<textarea name="notes">${esc(old.notes)}</textarea></label>`}if(type==='vehicles'){title='Pojazd';body=`<label>Nazwa pojazdu<input name="name" required placeholder="Np. GBA 3/16" value="${esc(old.name)}"></label><label>Numer operacyjny / identyfikator<input name="number" value="${esc(old.number)}"></label><label>Uwagi<textarea name="notes">${esc(old.notes)}</textarea></label>`}if(type==='tasks'){title='Checklista / zadanie';body=`<label>Nazwa czynności<input name="name" required value="${esc(old.name)}"></label><label>Obszar<select name="area">${opts(['Codzienna gotowość','Kontrola pojazdu','Kontrola sprzętu','Po działaniach','Inne'],old.area||'Codzienna gotowość')}</select></label><label>Przypisanie<input name="vehicle" placeholder="Np. GBA, plecak" value="${esc(old.vehicle)}"></label><label>Notatka<textarea name="notes">${esc(old.notes)}</textarea></label>`}if(type==='checks'){title='Przegląd / termin';body=`<label>Nazwa przeglądu<input name="name" required value="${esc(old.name)}"></label><label>Termin<input name="date" type="date" value="${esc(old.date)}"></label><label>Dotyczy<input name="subject" value="${esc(old.subject)}"></label><label>Uwagi<textarea name="notes">${esc(old.notes)}</textarea></label>`}if(type==='training'){title='Szkolenie / uprawnienie';body=`<label>Nazwa<input name="name" required value="${esc(old.name)}"></label><label>Data szkolenia<input name="date" type="date" value="${esc(old.date)}"></label><label>Data ważności / odnowienia<input name="expires" type="date" value="${esc(old.expires)}"></label><label>Uwagi<textarea name="notes">${esc(old.notes)}</textarea></label>`}if(type==='notes'){title='Notatka';body=`<label>Tytuł<input name="name" required value="${esc(old.name)}"></label><label>Treść<textarea name="notes" required>${esc(old.notes)}</textarea></label>`}openModal(`<h2>${title}</h2><form id="edit-form" class="form">${body}<div class="btnrow"><button class="btn" type="submit">Zapisz</button>${btn('Anuluj','closeModal()')}</div></form>`);document.getElementById('edit-form').onsubmit=e=>{e.preventDefault();const v=fields(e.target);if(type==='equipment'){v.required=Number(v.required);v.qty=Number(v.qty)}update(type,{...old,...v,id:old.id||uid(),done:old.done||false});closeModal()}}function alertCount(){return state.equipment.filter(x=>x.qty<x.required||dateDiff(x.expires)<=30).length+state.checks.filter(x=>dateDiff(x.date)<=30).length+state.training.filter(x=>dateDiff(x.expires)<=30).length}function home(){const missing=state.equipment.filter(x=>x.qty<x.required).length;const exp=state.equipment.filter(x=>dateDiff(x.expires)<=30).length;return `<div class="intro"><h1>Centrum ratownika</h1><p>Sprzęt, przeglądy, checklisty, szkolenia i przydatne pomoce. Wszystko zapisane lokalnie na tym urządzeniu.</p></div><div class="cards"><div class="card"><span>Pozycje sprzętu</span><strong>${state.equipment.length}</strong><span>${missing} z brakami</span></div><div class="card"><span>Najbliższe terminy</span><strong class="${alertCount()?'warn':''}">${alertCount()}</strong><span>przeterminowane lub ≤ 30 dni</span></div><div class="card"><span>Pojazdy</span><strong>${state.vehicles.length}</strong><span>w ewidencji</span></div><div class="card"><span>Checklisty</span><strong>${state.tasks.filter(x=>x.done).length}/${state.tasks.length}</strong><span>wykonanych</span></div></div><div class="section-title"><h2>Szybkie działania</h2></div><div class="panel btnrow">${btn('＋ Dodaj sprzęt',"modalForm('equipment')",'')}${btn('✓ Kontrola','go(\'checks\')')}${btn('KPP / procedury','go(\'guide\')')}${btn('Kalkulatory','go(\'tools\')')}</div><div class="panel"><h2>Wymagają uwagi</h2>${alerts()||'<div class="empty">Brak pilnych pozycji. Pamiętaj o fizycznej kontroli gotowości.</div>'}</div><div class="notice">RescueOS służy do ewidencji, szkolenia i przypominania. Nie jest narzędziem dowodzenia ani autoryzowanym systemem operacyjnym PSP.</div>`}function alerts(){let out='';state.equipment.filter(x=>x.qty<x.required||dateDiff(x.expires)<=30).slice(0,6).forEach(x=>out+=`<div class="item"><div class="item-main"><b>${esc(x.name)}</b><small>${x.qty<x.required?'Brak: '+(x.required-x.qty)+' szt. · ':''}${esc(x.vehicle)}</small></div>${labelStatus(x.expires)}</div>`);state.checks.filter(x=>dateDiff(x.date)<=30).slice(0,3).forEach(x=>out+=`<div class="item"><div class="item-main"><b>${esc(x.name)}</b><small>Przegląd</small></div>${labelStatus(x.date)}</div>`);state.training.filter(x=>dateDiff(x.expires)<=30).slice(0,3).forEach(x=>out+=`<div class="item"><div class="item-main"><b>${esc(x.name)}</b><small>Szkolenie</small></div>${labelStatus(x.expires)}</div>`);return out}function equipment(){let selected=state.equipment.filter(x=>[x.name,x.category,x.location,x.vehicle].some(v=>(v||'').toLowerCase().includes(equipmentSearch.toLowerCase()))&&(filterVehicle===''||x.vehicle===filterVehicle));return `<div class="section-title"><h2>Sprzęt i wyposażenie</h2>${btn('＋ Dodaj',"modalForm('equipment')",'')}</div><input class="search" placeholder="Szukaj sprzętu, skrytki, kategorii…" value="${esc(equipmentSearch)}" oninput="equipmentSearch=this.value;drawEquipmentList()"><div class="tabgroup" style="margin-top:12px"><button class="btn small ${!filterVehicle?'selected':'secondary'}" onclick="filterVehicle='';render()">Wszystko</button>${['Osobisty / plecak',...state.vehicles.map(x=>x.name)].map(v=>`<button class="btn small ${filterVehicle===v?'selected':'secondary'}" onclick="filterVehicle=${JSON.stringify(v).replace(/"/g,'&quot;')};render()">${esc(v)}</button>`).join('')}</div><div class="panel"><div id="eq-list">${renderEquipmentList(selected)}</div></div><div class="notice">Pozycje startowe nie są potwierdzoną listą wyposażenia. Wpisz faktyczne ilości i wymagania swojej jednostki.</div>`}function drawEquipmentList(){document.getElementById('eq-list').innerHTML=renderEquipmentList(state.equipment.filter(x=>[x.name,x.category,x.location,x.vehicle].some(v=>(v||'').toLowerCase().includes(equipmentSearch.toLowerCase()))&&(!filterVehicle||x.vehicle===filterVehicle)))}function renderEquipmentList(a){return a.length?a.map(x=>`<div class="item"><div class="item-main"><b>${esc(x.name)}</b><small>${esc(x.category)} · ${esc(x.vehicle)}${x.location?' · '+esc(x.location):''}</small><span class="tag ${x.qty<x.required?'bad':'ok'}">${x.qty} / ${x.required} szt.</span>${labelStatus(x.expires)}</div><div class="btnrow">${btn('Edytuj',`modalForm('equipment','${x.id}')`)}${btn('×',`remove('equipment','${x.id}')`,'danger small')}</div></div>`).join(''):'<div class="empty">Brak sprzętu. Dodaj pierwszą pozycję.</div>'}function vehicles(){return `<div class="section-title"><h2>Pojazdy</h2>${btn('＋ Pojazd',"modalForm('vehicles')",'')}</div><div class="panel">${state.vehicles.map(x=>`<div class="item"><div class="item-main"><b>${esc(x.name)}</b><small>${esc(x.number)} · ${state.equipment.filter(z=>z.vehicle===x.name).length} pozycji</small><small>${esc(x.notes)}</small></div>${btn('Edytuj',`modalForm('vehicles','${x.id}')`)}${btn('×',`remove('vehicles','${x.id}')`,'danger small')}</div>`).join('')||'<div class="empty">Dodaj pojazd i przypisz do niego sprzęt.</div>'}</div><div class="notice">Zmiana nazwy pojazdu nie przenosi automatycznie wcześniejszych przypisań sprzętu. Przed zmianą nazwy sprawdź przypisania.</div>`}function toggleTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;if(t.done){t.lastDone=new Date().toISOString();state.audit.unshift({id:uid(),name:t.name,date:t.lastDone})}save();render()}function resetTasks(){if(!confirm('Rozpocząć nową kontrolę i odznaczyć checklisty?'))return;state.tasks.forEach(x=>x.done=false);save();render()}function checks(){const total=state.tasks.length,done=state.tasks.filter(x=>x.done).length;return `<div class="section-title"><h2>Checklisty i kontrole</h2>${btn('＋ Zadanie',"modalForm('tasks')",'')}</div><div class="panel"><div class="btnrow" style="justify-content:space-between"><b>Wykonano ${done}/${total}</b>${btn('Nowa kontrola','resetTasks()')}</div><div class="progress" style="margin-top:12px"><div style="width:${total?Math.round(done/total*100):0}%"></div></div>${state.tasks.map(x=>`<div class="item"><input aria-label="Wykonano: ${esc(x.name)}" class="check" type="checkbox" ${x.done?'checked':''} onchange="toggleTask('${x.id}')"><div class="item-main"><b>${esc(x.name)}</b><small>${esc(x.area)} · ${esc(x.vehicle||'ogólne')}</small></div>${btn('✎',`modalForm('tasks','${x.id}')`)}${btn('×',`remove('tasks','${x.id}')`,'danger small')}</div>`).join('')||'<div class="empty">Nie ma jeszcze checklist. Dodaj zadania lub włącz zestaw startowy w ustawieniach.</div>'}</div><div class="section-title"><h2>Przeglądy i terminy</h2>${btn('＋ Termin',"modalForm('checks')",'')}</div><div class="panel">${state.checks.slice().sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')).map(x=>`<div class="item"><div class="item-main"><b>${esc(x.name)}</b><small>${esc(x.subject)} · ${esc(x.notes)}</small>${labelStatus(x.date)}</div>${btn('✎',`modalForm('checks','${x.id}')`)}${btn('×',`remove('checks','${x.id}')`,'danger small')}</div>`).join('')||'<div class="empty">Brak wpisanych przeglądów.</div>'}</div><div class="section-title"><h2>Historia wykonania zadań</h2></div><div class="panel">${state.audit.slice(0,30).map(x=>`<div class="item"><div class="item-main">${esc(x.name)}<small>${new Date(x.date).toLocaleString('pl-PL')}</small></div></div>`).join('')||'<div class="empty">Historia pojawi się po odhaczaniu zadań.</div>'}</div>`}const guides=[['Bezpieczeństwo i pierwsze działania','Oceń zagrożenia i zabezpiecz miejsce. Stosuj ŚOI odpowiednie do zagrożeń. Ustal liczbę poszkodowanych, wezwij odpowiednie siły przez właściwy kanał i działaj w granicach uprawnień oraz według poleceń KDR.'],['Ocena poszkodowanego','Sprawdź reakcję, drożność dróg oddechowych i prawidłowość oddechu (maks. 10 sekund). Oceń masywny krwotok i inne stany bezpośredniego zagrożenia życia. Zapewnij pomoc i regularnie ponawiaj ocenę.'],['RKO dorosłych i AED','Osoba nieprzytomna i nieoddychająca prawidłowo: natychmiast wezwij pomoc, rozpocznij uciski mostka 100–120/min na głębokość 5–6 cm. Jeśli jesteś przeszkolony i możesz wentylować, stosuj 30:2. Włącz AED jak najszybciej i wykonuj komunikaty urządzenia. Ogranicz przerwy w uciskach.'],['Masywny krwotok','Zadbaj o bezpieczeństwo i załóż ochronę osobistą. Zastosuj bezpośredni silny ucisk, odpowiedni opatrunek hemostatyczny lub opaskę uciskową w zagrażającym życiu krwotoku z kończyny, zgodnie z przeszkoleniem i aktualną procedurą. Zanotuj czas założenia opaski; nie luzuj jej samodzielnie.'],['Niedrożność dróg oddechowych u przytomnego dorosłego','Zachęć do kaszlu, jeśli jest skuteczny. Przy nieskutecznym kaszlu wykonuj naprzemiennie do 5 uderzeń między łopatki i do 5 uciśnięć nadbrzusza. Przy utracie przytomności rozpocznij RKO i wezwij pomoc. Postępowanie u niemowląt i dzieci różni się.'],['Urazy i unieruchomienie','Priorytet: bezpieczeństwo, masywne krwotoki, ABC i ograniczenie niepotrzebnych ruchów. Stabilizuj ręcznie zgodnie z oceną urazową. Nie przemieszczaj poszkodowanego bez wskazań bezpieczeństwa lub ratowniczych. Unieruchomienie i ewakuacja zgodnie ze szkoleniem, stanem poszkodowanego i procedurami.'],['Hipotermia / ochrona termiczna','Ogranicz dalszą utratę ciepła, odizoluj od podłoża i osłoń przed wiatrem oraz wilgocią. Delikatnie postępuj z głęboko wychłodzonym poszkodowanym. Zapewnij pilną pomoc medyczną.'],['Oparzenia','Przerwij działanie czynnika, oceń zagrożenia. Chłodź oparzenie termiczne chłodną bieżącą wodą przez około 20 minut, jeśli jest to wykonalne i nie nasila wychłodzenia. Usuń biżuterię z okolicy, nie odrywaj przyklejonej odzieży. Załóż jałowy nieprzylegający opatrunek.'],['Łączność i przekazanie poszkodowanego','Przekazuj krótko i jasno: miejsce, zagrożenia, liczba poszkodowanych, stan i najważniejsze objawy, wykonane czynności, dynamika zmian, potrzebne zasoby. Nie umieszczaj w tej aplikacji danych pozwalających identyfikować pacjentów.']];function guide(){return `<div class="section-title"><h2>Karty ratownicze / KPP</h2></div><div class="notice">Materiał edukacyjny i pomoc pamięciowa. Nie zastępuje aktualnych procedur KSRG, decyzji KDR, kursu KPP ani zaleceń systemu PRM. W sytuacji zagrożenia życia: 112.</div><div class="panel">${guides.map((x,i)=>`<details ${i===0?'open':''}><summary>${esc(x[0])}</summary><p>${esc(x[1])}</p></details>`).join('')}</div><div class="panel"><h2>Oficjalne dokumenty</h2><p><a href="https://www.gov.pl/web/kgpsp/zasady-ksrg" target="_blank" rel="noopener noreferrer">KG PSP – aktualne zasady KSRG ↗</a></p><p><a href="https://www.gov.pl/web/kwpsp-katowice/ratownictwo-medyczne" target="_blank" rel="noopener noreferrer">PSP – dokumenty KPP i ratownictwa medycznego ↗</a></p><p class="tiny">Linki wymagają internetu. Karty powyżej są dostępne offline po zainstalowaniu PWA.</p></div>`}const questions=[['Jaka jest częstotliwość ucisków klatki piersiowej w RKO dorosłego?',['60–80/min','100–120/min','140–160/min'],1,'Dla dorosłego zalecane jest 100–120 ucisków na minutę.'],['Jaki jest stosunek ucisków do oddechów w standardowym RKO dorosłego z wentylacją?',['15:2','30:2','5:1'],1,'Standardowo 30:2 dla przeszkolonego ratownika.'],['Co jest priorytetem przed podejściem do miejsca zdarzenia?',['Zrobienie dokumentacji','Bezpieczeństwo ratownika i miejsca','Wyjęcie sprzętu'],1,'Bezpieczeństwo ratownika i ocena zagrożeń zawsze są podstawą.'],['Jak szybko należy podłączyć AED przy NZK?',['Po 10 minutach','Dopiero po odzyskaniu oddechu','Jak najszybciej'],2,'AED stosuj bez zbędnej zwłoki i wykonuj polecenia.'],['Co zrobić po założeniu opaski uciskowej na masywny krwotok?',['Zanotować czas i nie luzować samodzielnie','Luzować co 5 minut','Przykryć czas założenia'],0,'Zanotuj czas i przekaż informację personelowi medycznemu.']];function quiz(){let q=questions[quizIndex%questions.length];return `<div class="panel"><h2>Test wiedzy KPP</h2><p>Pytanie ${(quizIndex%questions.length)+1} z ${questions.length} · Poprawne: ${state.quizStats.correct}/${state.quizStats.total}</p><p class="question">${esc(q[0])}</p><div class="form">${q[1].map((v,i)=>`<button class="btn secondary" style="text-align:left" ${quizAnswered?'disabled':''} onclick="answerQuiz(${i})">${String.fromCharCode(65+i)}. ${esc(v)}</button>`).join('')}</div><div id="quiz-result"></div></div>`}function answerQuiz(i){if(quizAnswered)return;quizAnswered=true;let q=questions[quizIndex%questions.length];state.quizStats.total++;if(i===q[2])state.quizStats.correct++;save();document.getElementById('quiz-result').innerHTML=`<p class="${i===q[2]?'okay':'bad'}"><b>${i===q[2]?'Poprawnie':'Niepoprawnie'}</b>. ${esc(q[3])}</p>${btn('Następne pytanie','nextQuiz()','')}`}function nextQuiz(){quizIndex++;quizAnswered=false;render()}function training(){return `<div class="section-title"><h2>Szkolenia i uprawnienia</h2>${btn('＋ Dodaj',"modalForm('training')",'')}</div><div class="panel">${state.training.map(x=>`<div class="item"><div class="item-main"><b>${esc(x.name)}</b><small>Odbyte: ${esc(x.date||'nie podano')} · ${esc(x.notes)}</small>${labelStatus(x.expires)}</div>${btn('✎',`modalForm('training','${x.id}')`)}${btn('×',`remove('training','${x.id}')`,'danger small')}</div>`).join('')||'<div class="empty">Dodaj KPP, ODO, kursy i terminy odnowienia uprawnień.</div>'}</div>${quiz()}`}function tools(){return `<div class="section-title"><h2>Kalkulatory szkoleniowe</h2></div><div class="notice">Wyniki są orientacyjne. Nie wykorzystuj ich jako jedynej podstawy decyzji operacyjnych, do nastaw urządzeń ani do planowania bezpiecznych warunków pracy.</div><div class="panel"><h2>Szacowany czas podawania wody</h2><div class="form form-grid"><label>Zbiornik [l]<input id="water" type="number" min="0" value="2500" oninput="calc()"></label><label>Łączny wydatek [l/min]<input id="flow" type="number" min="0" value="200" oninput="calc()"></label></div><p id="waterResult"></p><small class="muted">Uproszczenie: bez dolewania, rezerwy, zmian wydatku i strat.</small></div><div class="panel"><h2>Wydajność / przepływ</h2><div class="form form-grid"><label>Objętość [l]<input id="volume" type="number" min="0" value="1000" oninput="calc()"></label><label>Czas [min]<input id="minutes" type="number" min="0" value="5" oninput="calc()"></label></div><p id="flowResult"></p></div><div class="panel"><h2>Spadek ciśnienia hydrostatycznego</h2><label class="form">Różnica wysokości [m]<input id="height" type="number" min="0" value="10" oninput="calc()"></label><p id="pressureResult"></p><small class="muted">Około 0,098 bar/m dla wody; bez strat tarcia i dynamiki przepływu.</small></div>`}function calc(){const v=id=>Number(document.getElementById(id)?.value),fmt=n=>Number.isFinite(n)?n.toLocaleString('pl-PL',{maximumFractionDigits:2}):'—';document.getElementById('waterResult').textContent=v('flow')>0?`Teoretycznie: ${fmt(v('water')/v('flow'))} min`:'Podaj wydatek większy od zera';document.getElementById('flowResult').textContent=v('minutes')>0?`Średni przepływ: ${fmt(v('volume')/v('minutes'))} l/min`:'Podaj czas większy od zera';document.getElementById('pressureResult').textContent=`Różnica ciśnień: ≈ ${fmt(v('height')*.0981)} bar`}function notes(){return `<div class="section-title"><h2>Notatki techniczne</h2>${btn('＋ Dodaj',"modalForm('notes')",'')}</div><div class="panel">${state.notes.map(x=>`<div class="item"><div class="item-main"><b>${esc(x.name)}</b><small style="white-space:pre-wrap">${esc(x.notes)}</small></div>${btn('✎',`modalForm('notes','${x.id}')`)}${btn('×',`remove('notes','${x.id}')`,'danger small')}</div>`).join('')||'<div class="empty">Brak notatek. Nie zapisuj danych pacjentów ani wrażliwych informacji operacyjnych.</div>'}</div>`}function exportJSON(){const blob=new Blob([JSON.stringify({format:'RescueOS',version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='RescueOS-kopia-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}document.getElementById('importfile').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;const obj=JSON.parse(await file.text());if(obj.format!=='RescueOS'||!obj.data||!Array.isArray(obj.data.equipment))throw Error('Nieprawidłowy format kopii RescueOS');if(!confirm('Import zastąpi wszystkie obecne dane. Kontynuować?'))return;state={...defaultState(),...obj.data};save();render();alert('Przywrócono kopię zapasową.')}catch(err){alert('Nie udało się wczytać pliku: '+err.message)}finally{e.target.value=''}};function seed(){if(state.equipment.length||state.tasks.length){if(!confirm('Dodać przykładowe pozycje? Istniejące wpisy pozostaną.'))return}['Rękawiczki nitrylowe','Gaza jałowa','Bandaż elastyczny','Opatrunek indywidualny','Folia NRC','Nożyczki ratownicze','Maska do RKO'].forEach(name=>state.equipment.push({id:uid(),name,category:'KPP',vehicle:'Osobisty / plecak',qty:0,required:1,expires:'',location:'',notes:'Pozycja przykładowa; zweryfikuj wyposażenie'}));['Sprawdzenie środków ochrony indywidualnej','Kontrola kompletności plecaka KPP','Kontrola baterii i oświetlenia','Kontrola sprzętu łączności'].forEach(name=>state.tasks.push({id:uid(),name,area:'Codzienna gotowość',done:false,vehicle:'',notes:''}));save();render()}function settings(){return `<div class="section-title"><h2>Ustawienia RescueOS</h2></div><div class="panel"><h2>Profil</h2><form class="form" onsubmit="event.preventDefault();state.name=this.elements.namedItem('name').value;state.unit=this.elements.namedItem('unit').value;save();render();alert('Zapisano profil')"><label>Nazwa / pseudonim<input name="name" value="${esc(state.name)}"></label><label>Jednostka<input name="unit" placeholder="Np. OSP Różyniec" value="${esc(state.unit)}"></label><button class="btn" type="submit">Zapisz profil</button></form></div><div class="panel"><h2>Dane i kopia zapasowa</h2><p>Dane zapisują się tylko w pamięci przeglądarki tego urządzenia. Nie ma konta ani synchronizacji. Usunięcie danych strony może skasować ewidencję.</p><div class="btnrow">${btn('↓ Eksport JSON','exportJSON()','')}${btn('↑ Import JSON',"document.getElementById('importfile').click()")}</div></div><div class="panel"><h2>Przykładowa konfiguracja</h2><p>Dodaj przykładowe wyposażenie i checklisty. To nie jest oficjalny wykaz sprzętu Twojej jednostki.</p>${btn('＋ Dodaj szablon','seed()')}</div><div class="panel"><h2>Bezpieczeństwo</h2><p>Nie wpisuj danych osobowych poszkodowanych ani informacji niejawnych. GitHub Pages publicznie udostępnia kod aplikacji; wpisy zapisują się na urządzeniu, ale nie są szyfrowane odrębnym hasłem.</p>${btn('Usuń wszystkie dane',"if(confirm('Na pewno usunąć WSZYSTKIE dane RescueOS?')){state=defaultState();save();render()}",'danger small')}</div><div class="foot">RescueOS v1.0 • PWA offline • Niezależne narzędzie pomocnicze. Nie jest oficjalną aplikacją PSP, OSP ani KSRG.</div>`}function render(){const names={home:'⌂',equipment:'▣',vehicles:'🚒',checks:'☑',guide:'✚',training:'🎓',tools:'▤',notes:'✎',settings:'⚙'};const labels={home:'Start',equipment:'Sprzęt',vehicles:'Pojazdy',checks:'Kontrole',guide:'KPP',training:'Nauka',tools:'Narzędzia',notes:'Notatki',settings:'Opcje'};document.getElementById('unit-label').textContent=state.unit||'Osobiste centrum ratownika';document.getElementById('nav').innerHTML=['home','equipment','checks','guide','training','tools'].map(p=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><span>${names[p]}</span>${labels[p]}</button>`).join('');const pages={home,equipment,vehicles,checks,guide,training,tools,notes,settings};document.getElementById('app').innerHTML=(pages[page]||home)()+((page==='home'||page==='settings')?'<div class="btnrow" style="margin-top:14px">'+btn('Pojazdy',"go('vehicles')")+btn('Notatki',"go('notes')")+btn('Ustawienia',"go('settings')")+'</div>':'');if(page==='tools')calc()}render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
